# Batch Evaluation Configuration for All Gemini Models
# This file defines multiple test configurations to run in parallel

batch_mode: true
max_workers: 4
output_dir: eval_results

# List of test configurations
tests:
  # Gemini-2.5-Flash Next1 Tests
  - name: gemini_flash_next1_gaia
    mode: pipeline_next1
    dataset: gaia
    test_model: gemini-2.5-flash
    eval_model: gemini-2.5-pro
    max_samples: null
    test_max_tokens: 64000
    eval_max_tokens: 64000
    resume: true

  - name: gemini_flash_next1_gta
    mode: pipeline_next1
    dataset: gta
    test_model: gemini-2.5-flash
