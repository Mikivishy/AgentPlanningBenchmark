# Batch Configuration: GPT-4o Evaluation Next1 for All Datasets
# This configuration evaluates GPT-4o model predictions in next1 mode across all available datasets
batch_mode: true
max_workers: 8
output_dir: eval_results

tests:
  - name: gpt4o_evaluation_next1_gaia
    mode: evaluation_next1
    dataset: gaia
    prediction_file: eval_results/predictions/gaia_gpt-4o_next1_predictions.json
    test_model: null
    eval_model: gemini-2.5-pro
    max_samples: null
    test_max_tokens: 64000
    eval_max_tokens: 64000
    resume: true

  - name: gpt4o_evaluation_next1_gta
