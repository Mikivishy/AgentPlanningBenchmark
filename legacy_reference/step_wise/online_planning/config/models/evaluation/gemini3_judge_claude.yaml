# Next1 evaluation configuration for Claude Sonnet 4.5
# Uses gemini-3-pro-preview as the evaluation model

batch_mode: true
max_workers: 32
output_dir: eval_results
tests:
# Next1 (Online 1)
- name: framethinker_claude_sonnet_next1
  mode: evaluation_next1
  dataset: framethinker
  test_model: anthropic/claude-sonnet-4.5
  eval_model: gemini-3-pro-preview
  prediction_file: null
  max_samples: 50
  test_max_tokens: 64000
  eval_max_tokens: 64000
  resume: true
