# Batch Configuration: gpt-5 Inference Next1 for All Datasets
# This configuration runs gpt-5 model inference in next1 mode across all available datasets
batch_mode: true
max_workers: 8
output_dir: eval_results

tests:
  - name: gpt5_inference_next1_gaia
    mode: inference_next1
    dataset: gaia
    test_model: gpt-5
    eval_model: gemini-2.5-pro
    max_samples: 10
    test_max_tokens: 64000
    eval_max_tokens: 64000
    resume: true

  - name: gpt5_inference_next1_gta
    mode: inference_next1
    dataset: gta
